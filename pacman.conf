#
# SimulationOS build-host pacman.conf
#
# Used by mkarchiso/pacstrap to populate the ISO root. This file is read on the
# BUILD MACHINE, so it must not depend on files that only exist inside the ISO.
#
# The [cachyos] repository is declared with an explicit Server= URL rather than
# `Include = /etc/pacman.d/cachyos-mirrorlist` on purpose: the build must not
# silently require a developer-specific /etc/pacman.d file to be present.
# The CachyOS *keyring* is still required on the build host so signatures can be
# verified - scripts/build-iso.sh checks for it and refuses to continue without
# it. Signature verification is never disabled.

[options]
HoldPkg     = pacman glibc
Architecture = x86_64

Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
DisableDownloadTimeout

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#
# Order matters: Arch repositories are listed FIRST so that a package present in
# both Arch and CachyOS is taken from Arch. SimulationOS deliberately uses
# CachyOS only for what is exclusive to it (linux-cachyos, cachyos-calamares,
# ckbcomp, mkinitcpio-openswap, cachyos-keyring, cachyos-mirrorlist) instead of
# adopting the whole CachyOS-optimised package set.
#

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo
Server = https://cdn.cachyos.org/repo/$arch/$repo
