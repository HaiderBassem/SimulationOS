LABEL simulationos
TEXT HELP
Boot SimulationOS on BIOS.
Starts the live Hyprland desktop, from which SimulationOS can be installed.
ENDTEXT
MENU LABEL SimulationOS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 %KERNEL_PARAMS%

# Accessibility boot option
LABEL simulationosspeech
TEXT HELP
Boot SimulationOS on BIOS with the speakup screen reader.
ENDTEXT
MENU LABEL SimulationOS (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on console=ttyS0,115200 console=tty0 %KERNEL_PARAMS%
