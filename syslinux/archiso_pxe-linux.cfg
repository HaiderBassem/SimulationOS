LABEL simulationos
TEXT HELP
Boot SimulationOS via PXE.
ENDTEXT
MENU LABEL SimulationOS (%ARCH%, PXE)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archiso_http_srv=${pxeserver}/ %KERNEL_PARAMS%
SYSAPPEND 3

LABEL simulationosspeech
TEXT HELP
Boot SimulationOS via PXE with the speakup screen reader.
ENDTEXT
MENU LABEL SimulationOS (%ARCH%, PXE) with ^speech
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archiso_http_srv=${pxeserver}/ accessibility=on %KERNEL_PARAMS%
SYSAPPEND 3
