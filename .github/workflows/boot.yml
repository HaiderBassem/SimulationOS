# L4 - boot the built ISO in QEMU and require proof it reached a target.
#
# Split from iso.yml so a boot regression is distinguishable from a build
# regression at a glance.
name: boot-test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  boot:
    name: QEMU boot (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # SimulationOS declares bios.syslinux and uefi.systemd-boot, so both
        # are tested. Do not add firmware here that the profile does not
        # actually support.
        firmware: [uefi, bios]
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf

      - name: Download the ISO built by this pipeline
        uses: actions/download-artifact@v4
        with:
          name: simulationos-iso
          path: out

      - name: Enable KVM if the runner provides it
        run: |
          # Hosted runners usually have no nested virtualisation; TCG is the
          # fallback and is slow but correct.
          [ -e /dev/kvm ] && echo "KVM available" || echo "no /dev/kvm; using TCG"

      - name: Boot test
        env:
          SIMOS_BOOT_TEST_FIRMWARE: ${{ matrix.firmware }}
          SIMOS_BOOT_TEST_TIMEOUT: '1500'
        run: ./scripts/boot-test.sh

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ matrix.firmware }}
          path: out/boot-test-*.log
          if-no-files-found: ignore
