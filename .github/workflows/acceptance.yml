# L4b/L5 - runtime acceptance of the built ISO on an x86_64 runner.
#
# Two jobs, deliberately separate so a live-desktop regression is
# distinguishable from a security-cleanup regression:
#
#   live-health     boots the ISO, logs in on serial and asserts on RUNNING
#                   state: graphical.target, SDDM, Hyprland, session
#                   components, NetworkManager, DNS, PipeWire, portals.
#   deloop-contract extracts the SquashFS, runs simulationos-deloop exactly as
#                   Calamares does, and asserts the installed-system security
#                   gates (liveuser gone, autologin gone, NOPASSWD gone, root
#                   locked, archiso initramfs hook gone).
name: acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: Name of the ISO artifact to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  live-health:
    name: Live system health
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf
      - name: Download the ISO
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: out
      - name: KVM availability
        run: |
          # Hosted runners have no nested virtualisation; TCG is correct but
          # slow. This is recorded so a timeout can be attributed correctly.
          if [ -e /dev/kvm ]; then echo "KVM available"; else echo "no /dev/kvm -> TCG"; fi
      - name: Live health checks
        env:
          SIMOS_LIVE_TIMEOUT: '2100'
        run: ./scripts/live-health.sh
      - name: Upload live log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-health-log-${{ github.sha }}
          path: out/live-health.log
          if-no-files-found: ignore

  deloop-contract:
    name: De-live security contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools libarchive-tools
      - name: Download the ISO
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: out
      - name: Verify the de-live transformation
        run: sudo ./scripts/deloop-test.sh
