---
# SimulationOS Calamares configuration.
#
# Launched as:  calamares -c /usr/share/simulationos/calamares
# The -c flag overrides Calamares' appDataDir, which relocates settings.conf,
# modules/ and branding/ into this directory. This is why SimulationOS does not
# ship anything under /etc/calamares: cachyos-calamares already owns
# /etc/calamares/modules/*.conf and declares no backup= array, so an airootfs
# overlay there would be a hard pacstrap file conflict.
#
# Installation model: OFFLINE. The live SquashFS is unpacked onto the target,
# then live-only configuration is stripped again by the "deloop" shell process.

modules-search: [ local ]

instances:
- id:     deloop
  module: shellprocess
  config: shellprocess_deloop.conf
- id:     verify
  module: shellprocess
  config: shellprocess_verify.conf

# Order follows the current CachyOS offline sequence (settings_offline.conf)
# with one deliberate difference: SimulationOS de-lives the target BEFORE the
# initramfs is generated.
#
#   unpackfs            copy the live SquashFS onto the target
#   removeuser          delete the live account (userdel -r liveuser)
#   shellprocess@deloop strip every live-only concession, install the kernel
#                       image into /boot and delete the archiso mkinitcpio
#                       drop-in. MUST precede initcpiocfg/initcpio: generating
#                       the initramfs first would bake the archiso hooks into
#                       the installed system and make it unbootable without
#                       the ISO.
#   initcpiocfg/initcpio  normal mkinitcpio configuration and image
#   users ... services  the installed user, network, display manager, units
#   packages            remove installer-only packages
#   grubcfg/bootloader  GRUB into the TARGET (ESP + grub.cfg)
#   shellprocess@verify refuse to report success for a system that cannot boot
#                       or still carries live-medium state
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - shellprocess@deloop
  - initcpiocfg
  - initcpio
  - users
  - networkcfg
  - displaymanager
  - hwclock
  - services-systemd
  - packages
  - grubcfg
  - bootloader
  - shellprocess@verify
  - umount
- show:
  - finished

branding: simulationos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true

# Required by Calamares >= 3.4: hide Back/Next while jobs run.
hide-back-and-next-during-exec: true
quit-at-end: false
