---
# SimulationOS Calamares configuration.
#
# Launched as:  calamares -c /usr/share/simulationos/calamares
# The -c flag overrides Calamares' appDataDir, which relocates settings.conf,
# modules/ and branding/ into this directory. This is why SimulationOS does not
# ship anything under /etc/calamares: cachyos-calamares already owns
# /etc/calamares/modules/*.conf and declares no backup= array, so an airootfs
# overlay there would be a hard pacstrap file conflict.
#
# Installation model: OFFLINE. The live SquashFS is unpacked onto the target,
# then live-only configuration is stripped again by the "deloop" shell process.

modules-search: [ local ]

instances:
- id:     deloop
  module: shellprocess
  config: shellprocess_deloop.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - removeuser
  # deloop MUST run before initcpio: it deletes
  # /etc/mkinitcpio.conf.d/archiso.conf, which would otherwise force archiso
  # hooks into the installed system's initramfs and make it unbootable
  # without the ISO.
  - shellprocess@deloop
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: simulationos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
