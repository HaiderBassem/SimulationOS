---
defaultGroups:
    - name: users
      must_exist: true
      system: false
    - wheel
    - audio
    - video
    - network
    - storage
    - input
    - lp
    - scanner
    - rfkill

# The installed system gets a normal login screen; live autologin is not
# carried over. See also sddm.conf.d/20-simulationos-live-autologin.conf,
# which simulationos-deloop deletes from the target.
autologinGroup: autologin
doAutologin:    false

sudoersGroup: wheel
setRootPassword: false
doReusePassword: false

availableShells: /bin/bash

passwordRequirements:
    minLength: 6

user:
    shell: /bin/bash
    home_permissions: "o700"
    forbidden_names:
        - root
        - liveuser

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "simulationos"
    forbidden_names: [ localhost ]
