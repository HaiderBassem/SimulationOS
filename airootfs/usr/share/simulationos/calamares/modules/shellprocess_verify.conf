---
# Last job before umount: assert the target is a bootable, de-lived
# SimulationOS. Failing here turns "Installation Complete" into an explicit
# error naming the broken property, instead of a system that fails on reboot.
dontChroot: false
timeout: 300
verbose: true
script:
    - "/usr/share/simulationos/calamares/scripts/simulationos-verify-target"
    # The installer configuration is only removed once nothing needs it.
    - "rm -rf /usr/share/simulationos/calamares /usr/lib/simulationos/calamares-compat"
