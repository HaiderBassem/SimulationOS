---
# SimulationOS installs GRUB on the target. GRUB covers BIOS and UEFI with a
# single code path, which keeps the Alpha's installed-system boot story simple.
# (The ISO itself uses syslinux + systemd-boot; that is a separate concern.)
efiBootLoader: "grub"

kernel:   "/vmlinuz-linux-cachyos"
img:      "/initramfs-linux-cachyos.img"
fallback: "/initramfs-linux-cachyos-fallback.img"

timeout: "5"
bootloaderEntryName: "SimulationOS"
kernelParams: [ "quiet", "loglevel=3" ]

grubInstall:   "grub-install"
grubMkconfig:  "grub-mkconfig"
grubCfg:       "/boot/grub/grub.cfg"
grubProbe:     "grub-probe"
efiBootMgr:    "efibootmgr"
efiBootloaderId: "SimulationOS"

installEFIFallback: true
