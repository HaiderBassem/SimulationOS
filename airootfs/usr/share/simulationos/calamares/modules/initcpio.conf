---
# Runs `mkinitcpio -P` in the target ("all" = every preset in
# /etc/mkinitcpio.d), producing /boot/initramfs-linux-cachyos.img from the
# target's own /etc/mkinitcpio.conf. simulationos-deloop has already installed
# /boot/vmlinuz-linux-cachyos and removed the archiso drop-in.
kernel: all
be_unsafe: false
