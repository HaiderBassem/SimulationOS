---
backend: pacman

pacman:
    num_retries: 1
    disable_download_timeout: true
    needed_only: true

update_db: false
update_system: false

operations:
    # The installer itself and the live-only partitioning GUI have no place on
    # the installed system. try_remove never fails the installation.
    - try_remove:
        - cachyos-calamares
        - gparted
