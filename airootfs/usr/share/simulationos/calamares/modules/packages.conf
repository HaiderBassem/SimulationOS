---
backend: pacman

# Offline install: never touch the network from here.
skip_if_no_internet: false
update_db: false
update_system: false

pacman:
    num_retries: 0
    disable_download_timeout: true
    needed_only: true

operations:
    # Installer-only and live-medium-only packages have no place on the
    # installed system. try_remove never fails the installation.
    #   cachyos-calamares    the installer itself
    #   gparted              live partitioning GUI
    #   mkinitcpio-archiso   archiso initramfs hooks (live boot only)
    #   livecd-sounds        live accessibility sound helper
    #   syslinux             boots the ISO in BIOS mode; the target uses GRUB
    #   memtest86+*          boot-menu entries of the ISO
    - try_remove:
        - cachyos-calamares
        - gparted
        - mkinitcpio-archiso
        - livecd-sounds
        - syslinux
        - memtest86+
        - memtest86+-efi
