---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "sddm.service"
      action: "enable"
      mandatory: true
    - name: "bluetooth.service"
      action: "enable"
      mandatory: false
    - name: "systemd-timesyncd.service"
      action: "enable"
      mandatory: false
    - name: "fstrim.timer"
      action: "enable"
      mandatory: false
    # Live-medium services that must not run on an installed system.
    - name: "pacman-init.service"
      action: "disable"
      mandatory: false
    - name: "livecd-talk.service"
      action: "disable"
      mandatory: false
    - name: "livecd-alsa-unmuter.service"
      action: "disable"
      mandatory: false
    - name: "vboxservice.service"
      action: "disable"
      mandatory: false
