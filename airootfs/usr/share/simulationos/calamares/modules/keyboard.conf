---
# Persists the keyboard chosen in the installer:
#   /etc/vconsole.conf                     console keymap
#   /etc/X11/xorg.conf.d/00-keyboard.conf  SDDM greeter / X11
#   /etc/default/keyboard                  read by SimulationOS's hyprland.lua,
#                                          so the Hyprland session uses the
#                                          same layout the user picked here
xOrgConfFileName:    "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
useLocale1: true
configure:
    kwin: false
    gnome: false
