---
# Runs simulationos-deloop inside the target chroot. A non-zero exit aborts
# the installation with the failing step shown in the Calamares error dialog;
# a half-cleaned system must never be reported as a successful install.
dontChroot: false
timeout: 1200
verbose: true
script:
    - "/usr/share/simulationos/calamares/scripts/simulationos-deloop"
