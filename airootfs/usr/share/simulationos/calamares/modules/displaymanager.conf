---
# SDDM is the only display manager SimulationOS ships. Autologin is never
# requested (users.conf: doAutologin false), so this writes an empty
# [Autologin] block to /etc/sddm.conf: the installed system shows the greeter.
displaymanagers:
  - sddm
basicSetup: false
sysconfigSetup: false
sddm:
  configuration_file: "/etc/sddm.conf"
