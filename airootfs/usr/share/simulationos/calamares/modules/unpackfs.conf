---
# Offline install: copy the live SquashFS onto the target.
# Path comes from archiso: the medium is mounted at /run/archiso/bootmnt and
# the image lives at <install_dir>/<arch>/airootfs.sfs, with
# install_dir="arch" and arch="x86_64" from profiledef.sh.
unpack:
    - source:      "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
      sourcefs:    "squashfs"
      destination: ""
