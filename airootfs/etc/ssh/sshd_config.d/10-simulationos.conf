# SimulationOS.
#
# sshd is installed but NOT enabled by default. SimulationOS is a graphical
# desktop medium, not a headless install medium, so there is no reason to
# expose a network service on a system whose live accounts have no password.
#
# Upstream archiso ships "PermitRootLogin yes" + "PasswordAuthentication yes"
# here for unattended/headless installs. That combination is only safe because
# OpenSSH defaults PermitEmptyPasswords to no. SimulationOS does not rely on
# that: root login over SSH is refused outright.
#
# To use SSH from the live session:
#     passwd                       # give the account a real password
#     sudo systemctl start sshd
PermitRootLogin no
PasswordAuthentication yes
PermitEmptyPasswords no
