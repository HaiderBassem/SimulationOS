# SimulationOS - per-machine monitor and override file.
#
# This file is sourced at the END of hyprland.conf, so anything set here wins.
# It is intentionally empty by default: the generic
#     monitor = , preferred, auto, 1
# rule in hyprland.conf already configures every detected output.
#
# Examples:
#   monitor = eDP-1,  1920x1080@60, 0x0,    1
#   monitor = HDMI-A-1, preferred,  1920x0, 1
#   monitor = , disable
