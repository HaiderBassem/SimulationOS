# SimulationOS - hyprlock
background {
    monitor =
    path = /usr/share/backgrounds/simulationos/simos-winter.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(1793d1)
    inner_color = rgb(14161a)
    font_color = rgb(e6e6e6)
    fail_color = rgb(c0392b)
    placeholder_text = <span foreground="##888888">Password</span>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = SimOS
    color = rgba(230, 230, 230, 1.0)
    font_size = 30
    font_family = Fira Sans
    position = 0, 60
    halign = center
    valign = center
}

# "SimOS" in ASCII binary.
label {
    monitor =
    text = 01010011 01101001 01101101 01001111 01010011
    color = rgba(51, 204, 255, 0.85)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
