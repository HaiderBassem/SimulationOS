# ┌──────────────────────────────────────────────────────────────────────────┐
# │ SimulationOS - Hyprland configuration                                    │
# │                                                                          │
# │ Deliberately small and flat so it can be debugged. Every command         │
# │ referenced here is provided by a package in packages.x86_64:             │
# │   kitty wofi thunar waybar mako hyprpaper hyprpolkitagent                │
# │   grim slurp wl-clipboard cliphist brightnessctl pavucontrol             │
# │   nm-connection-editor network-manager-applet blueman                    │
# │   simos-screenshot simos-powermenu simos-clipboard (airootfs/usr/local)  │
# │                                                                          │
# │ Put personal overrides in ~/.config/hypr/monitors.conf (sourced last).   │
# └──────────────────────────────────────────────────────────────────────────┘

$mainMod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$fileManager = thunar

# ──────────────────────────────────────────────────────────────── environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Allows the session to come up on machines and VMs without a real GPU.
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# ────────────────────────────────────────────────────────────────── autostart
# Order matters: the portal/dbus environment must be exported before apps that
# rely on it (file pickers, screensharing) are launched.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store

# ─────────────────────────────────────────────────────────────────── monitors
# Default: let Hyprland pick the preferred mode for every output.
monitor = , preferred, auto, 1

# ─────────────────────────────────────────────────────────────────────── input
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ───────────────────────────────────────────────────────────────── appearance
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(1793d1ee) rgba(33ccffee) 45deg
    col.inactive_border = rgba(2a2a2aaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4, easeOutQuint, popin 90%
    animation = fade, 1, 4, easeOutQuint
    animation = workspaces, 1, 5, easeOutQuint, slide
    animation = border, 1, 6, easeOutQuint
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    font_family = Fira Sans
}

# Software cursors keep the pointer visible in VMs and on drivers with broken
# hardware cursor planes. SimulationOS is expected to be evaluated in a VM.
cursor {
    no_hardware_cursors = true
}

# ─────────────────────────────────────────────────────────────────── keybinds
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $launcher
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod, X, exec, simos-powermenu
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, C, exec, simos-clipboard
bind = $mainMod SHIFT, N, exec, nm-connection-editor

# Screenshots
bind = , Print, exec, simos-screenshot full
bind = SHIFT, Print, exec, simos-screenshot area
bind = $mainMod, Print, exec, simos-screenshot window

# Focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media / hardware keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ────────────────────────────────────────────────────────────────── windowrules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.FileRoller)$
windowrulev2 = float, title:^(Install SimulationOS)$
windowrulev2 = size 1024 680, class:^(calamares)$
windowrulev2 = center, class:^(calamares)$
windowrulev2 = suppressevent maximize, class:.*

# ───────────────────────────────────────────────────────── user overrides last
source = ~/.config/hypr/monitors.conf
