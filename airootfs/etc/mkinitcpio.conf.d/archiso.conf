# SimulationOS live medium initramfs.
#
# Upstream archiso also carries archiso_pxe_common / _nbd / _http / _nfs for
# netboot. SimulationOS does not support PXE: the product journey is
# download -> flash USB -> boot. Those hooks are omitted rather than left in
# place, because each one needs support files we would otherwise have to ship:
#   archiso_pxe_common -> /usr/lib/initcpio/ipconfig  (mkinitcpio-nfs-utils)
#   archiso_pxe_nbd    -> nbd-client                  (nbd)
#   archiso_pxe_nfs    -> /usr/lib/initcpio/nfsmount  (mkinitcpio-nfs-utils)
# Keeping the hooks without those packages makes mkinitcpio fail.
# validate-profile.sh enforces the hook -> package relationship.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
