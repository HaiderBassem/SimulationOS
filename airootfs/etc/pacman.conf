#
# /etc/pacman.conf - SimulationOS
#
# See the pacman.conf(5) manpage for option and repository directives.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DisableDownloadTimeout

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#
# Arch first, CachyOS last: see the comment in the build-host pacman.conf.
# Here the mirrorlists come from the pacman-mirrorlist and cachyos-mirrorlist
# packages, both of which are installed in SimulationOS.
#

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
